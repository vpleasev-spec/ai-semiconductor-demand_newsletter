name: AI Demand Monitoring

on:
  workflow_dispatch:
  schedule:
    # Monday and Thursday 08:00 KST
    # Sunday and Wednesday 23:00 UTC
    - cron: "0 23 * * 0,3"

permissions:
  contents: read

concurrency:
  group: ai-demand-monitoring
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore deduplication history
        uses: actions/cache/restore@v4
        with:
          path: history.json
          key: ai-demand-history-${{ github.run_id }}
          restore-keys: |
            ai-demand-history-

      - name: Create history file when absent
        shell: bash
        run: |
          if [ ! -f history.json ]; then
            printf '{"seen_urls": []}\n' > history.json
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python news.py

      - name: Save deduplication history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: history.json
          key: ai-demand-history-${{ github.run_id }}
