name: AI Demand Monitoring

on:
  workflow_dispatch:
  schedule:
    # 월요일·목요일 오전 8시 KST
    # 일요일·수요일 오후 11시 UTC
    - cron: "0 8 * * 1,4"
      timezone: "Asia/Seoul"

permissions:
  contents: read

concurrency:
  group: ai-demand-monitoring
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore history cache
        id: history-cache
        uses: actions/cache@v4
        with:
          path: history.json
          key: ai-demand-history-${{ github.run_id }}
          restore-keys: |
            ai-demand-history-

      - name: Create history file when absent
        shell: bash
        run: |
          if [ ! -f history.json ]; then
            printf '{"seen_urls": []}\n' > history.json
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run newsletter
        env:          
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python news.py
